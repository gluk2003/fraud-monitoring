global:
  scrape_interval: 1s
  evaluation_interval: 1s
  scrape_timeout: 900ms
scrape_configs:
  - job_name: scorer
    static_configs:
      - targets: ['scorer:8000']
  - job_name: writer
    static_configs:
      - targets: ['writer:8001']
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
